# Prometheus: the "how often, how fast, how much" store.
#
# It scrapes almost nothing. The app cannot be scraped at all - Vercel freezes an instance the
# moment it answers, so there is no process sitting there to ask. Everything about QuoteMy arrives
# by PUSH instead: Alloy derives metrics from the log lines the app sends and remote-writes them
# here. The scrape jobs below are only this stack watching itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: quotemy

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Alloy's own health. If this goes quiet, nothing from Vercel is arriving either - and that is
  # the failure that otherwise looks exactly like "no traffic today".
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
