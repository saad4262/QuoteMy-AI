# QuoteMy AI - observability stack, local.
#
# Four services plus a gate. Everything binds to 127.0.0.1 on purpose: the only thing that should
# ever be reachable from outside this machine is the gate, and even that only through the tunnel
# set up in Phase 4.
#
#   grafana     :3000   the screens
#   prometheus  :9090   numbers over time
#   loki        :3100   the log lines themselves
#   alloy       :12345  the pipe's own health page
#   gate        :8080   where Vercel pushes  <- the tunnel points here
#
# Start:   cd observability && docker compose up -d
# Stop:    docker compose down          (data survives - it is in named volumes)
# Wipe:    docker compose down -v       (data does not)

# Versions are pinned to what was verified working on 2026-09-12. `latest` would quietly become
# something else in three months and take these configs with it - Loki's schema config in
# particular does not survive a major bump untouched. Bump deliberately, then re-run smoke-test.sh.

name: quotemy-observability

services:
  loki:
    image: grafana/loki:3.7.7
    container_name: quotemy-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: quotemy-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # Without this flag Alloy cannot push metrics in at all, and the whole customer-side and
      # cost picture stays empty. It is not on by default.
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: quotemy-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  gate:
    image: caddy:2.11.4-alpine
    container_name: quotemy-gate
    environment:
      # No default. A stack that silently comes up with an empty secret is worse than one that
      # refuses to start, because the tunnel in Phase 4 would then be wide open and look fine.
      TELEMETRY_SECRET: ${TELEMETRY_SECRET:?set TELEMETRY_SECRET in observability/.env - see .env.example}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - alloy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: quotemy-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Explore is how you read a log line. On by default, named here so it stays on.
      GF_EXPLORE_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
  alloy-data:
  caddy-data:
